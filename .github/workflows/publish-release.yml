name: Publish release
on:
  release:
    types: [published]
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
jobs:
  publish-release:
    permissions:
      packages: write
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # ratchet:actions/setup-java@v6.1.0
        with:
          java-version: 21
          distribution: "temurin"
          cache: "gradle"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # ratchet:docker/setup-buildx-action@v4.4.1
      - name: Publish artifact and images
        # Use release event payload as source of truth for version.
        # For `release: published`, `github.event.release.tag_name` contains the release tag (e.g. 5.0.0).
        # Fail fast if empty to avoid publishing with an empty Gradle version.
        env:
          NEW_VERSION: ${{ github.event.release.tag_name }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
          # must be an armored (i.e. ascii) private key _only_ (no public key block)
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[debug] github.event.release.tag_name='${NEW_VERSION}'"
          echo "[debug] GITHUB_REF='${GITHUB_REF}'"
          echo "[debug] GITHUB_REF_NAME='${GITHUB_REF_NAME}'"
          if [ -z "${NEW_VERSION}" ]; then
            echo "NEW_VERSION is empty (github.event.release.tag_name missing). Failing early."
            exit 1
          fi

          IMAGE=${IMAGE_NAME}:${NEW_VERSION}
          echo "Releasing new version ${NEW_VERSION} of $IMAGE"

          ./gradlew jib --image="${IMAGE}"
          MAJOR=$(echo "${NEW_VERSION}" | cut -d "." -f1)
          MINOR=$(echo "${NEW_VERSION}" | cut -d "." -f1-2)
          docker buildx imagetools create -t "${IMAGE_NAME}:${MAJOR}" -t "${IMAGE_NAME}:${MINOR}" "${IMAGE}"

          ./gradlew -Pversion="${NEW_VERSION}" publishAllPublicationsToGithubPackagesRepository publishAndReleaseToMavenCentral --no-configuration-cache
      - name: Login to Google Artifact Registry
        id: gar-login
        continue-on-error: true
        uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # ratchet:nais/login@v0
        with:
          team: mock-oauth2-server
      - name: Copy images to Google Artifact Registry
        if: steps.gar-login.outcome == 'success'
        continue-on-error: true
        env:
          NEW_VERSION: ${{ github.event.release.tag_name }}
          GAR_IMAGE_NAME: ${{ steps.gar-login.outputs.registry }}/${{ github.event.repository.name }}
        run: |
          MAJOR=$(echo "${NEW_VERSION}" | cut -d "." -f1)
          MINOR=$(echo "${NEW_VERSION}" | cut -d "." -f1-2)
          docker buildx imagetools create -t "${GAR_IMAGE_NAME}:${NEW_VERSION}" -t "${GAR_IMAGE_NAME}:${MAJOR}" -t "${GAR_IMAGE_NAME}:${MINOR}" "${IMAGE_NAME}:${NEW_VERSION}"
