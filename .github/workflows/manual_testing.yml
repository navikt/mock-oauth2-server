name: Manually triggered playground

on:
  workflow_dispatch:

env:

  IMAGE_NAME: ttl.sh/${{ github.repository }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          ref: add-arm64-architecture

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # ratchet:actions/setup-java@v6.0.1
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build JVM stuff
        run: ./gradlew build

      - name: Build Docker images for amd64 and arm64
        # The GITHUB_REF tag comes in the format 'refs/tags/xxx'.
        # So if we split on '/' and take the 3rd value, we can get the release name.
        run: |
          NEW_VERSION=1h
          IMAGE=${IMAGE_NAME}:${NEW_VERSION}
          echo "Building new version ${NEW_VERSION} of $IMAGE"
          ./gradlew jib --image="${IMAGE}"
