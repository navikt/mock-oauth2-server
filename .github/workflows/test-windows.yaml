name: Test Windows
on:
  push:
    branches:
      - feat/classpath-login-page

jobs:
  test_windows:
    runs-on: windows-latest
    steps:
      - name: Checkout latest code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # ratchet:actions/setup-java@v6.1.0
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Test static assets and login page
        shell: bash
        run: ./gradlew test --tests '*StaticAssetsIntegrationTest*' --tests '*LoginPageIntegrationTest*'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: test-reports-windows
          path: build/reports/tests/test
